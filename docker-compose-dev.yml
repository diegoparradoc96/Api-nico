services:
  postgres-db:
    image: postgres:18.4
    container_name: postgres_backend_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: express_api_server
    restart: always
    command: ["pnpm", "run", "dev"]
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres-db

volumes:
  postgres_data: